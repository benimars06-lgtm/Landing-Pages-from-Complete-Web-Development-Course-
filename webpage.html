<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Youtube Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(black, gray);
            background-size: contain;
            /* background-repeat: no-repeat; */
             /* 
            height: 600px; */
        } 
        .carousel {
            background-size: cover;
            background-color: black;
        }

        @media (width <= 946px) {
            .carousel {
                display: flex;
                width: 100%;

                img {
                    padding-left: 80px;
                }
                /* height: 750px; */



            }

        }

        .carousel-inner {
            /* background-color: black; */
            display: flex;
            height: 20%;
            justify-content: center;
            padding-right: 470px;
            margin: 0;
            @media (max-width: 950px){
                padding-right: 450px;

            }
        } 
        
        /*Add phone functionality concerning the ratio of the */

        .d-block {
            /* height: 620; */
            max-width: 480px;
            min-width: 380px;
        }

        .youtube-cards {
            background: linear-gradient(black, gray, white);
            background-size: 80%;
            display: flex;
            padding: 80px 130px 130px;
            /* padding: 40px 130px 130px;
            height: 600px; */
            column-gap: 160px;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .card-img-top {
            min-width: auto;
        }

        .btn {
            width: 100%;
            border-radius: 20px;
        }
        .card-1 {
            margin-bottom: 15px;
        }

        .card-1 .btn:hover {
            background-color: aqua;
            color: rgb(105, 158, 168);
            /* border: rgb(129, 129, 241); */
        }

        .card-2 {
            margin-bottom: 15px;
        }

        .card-2 .btn:hover {
            background-color: orangered;
            border-color: orange;
        }

        .card-3 {
            margin-bottom: 15px;
        }
        .card-3 .btn {
            margin-top: 23px;
        }

        .card-3 .btn:hover {
            background-color: blue;
        }

        .copyright {
            height: 60px;
            width: 100%;
            border: dashed black;
            border-radius: 10px;
            background-color: whitesmoke;
            text-align: center;
            padding-top: 15px;

        }

        .youtube-cards img {
            max-width: 286px;
            height: 157.26px; 
        }




    </style>
</head>
<body>

              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="https://images.pexels.com/photos/7775642/pexels-photo-7775642.jpeg" class="d-block w-100" alt="work-from-home" title="first-slide">
              </div>
              <div class="carousel-item">
                <img src="https://images.pexels.com/photos/18264716/pexels-photo-18264716.jpeg" class="d-block w-100" alt="showing-off-code" title="second-slide">
              </div>
              <div class="carousel-item">
                <img src="https://images.pexels.com/photos/2756843/pexels-photo-2756843.jpeg" class="d-block w-100" alt="code-debug-with-glasses" title="third-slide">
              </div>
            </div>
            <div class="slide-buttons">
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                  </button>
                  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                  </button>
            </div>
          </div>
